name: Mirror release

# Copies each release of this (private) repository, with its downloads, to the public repository
# named by the PUBLIC_RELEASE_REPO variable (rmorgan001/GS.Point3DWeb-Releases). Only the release is
# copied: the public repository gets a tag of the same name on its own main branch, never this code.
#
# Runs after each successful Release run, or by hand (Actions > Mirror release > Run workflow) to
# copy an earlier release again.
#
# Needs the PUBLIC_RELEASES_TOKEN secret: a fine-grained personal access token for the public
# repository only, with Contents: Read and write. Nothing else.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to mirror (e.g. v1.0.0)
        required: true

permissions:
  contents: read # read this repository's releases

concurrency:
  group: mirror-release-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    # After a Release run, only if it succeeded (it ran for a tag push, so head_branch is the tag).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
      SOURCE_REPO: ${{ github.repository }}
      TARGET_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}

    steps:
      - name: Check the settings
        env:
          HAS_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN != '' }}
        run: |
          [[ -n "$TARGET_REPO" ]] || { echo "::error::Set the PUBLIC_RELEASE_REPO variable (owner/name of the public repository)"; exit 1; }
          [[ "$HAS_TOKEN" == true ]] || { echo "::error::Set the PUBLIC_RELEASES_TOKEN secret (a token that can write to $TARGET_REPO)"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a version tag like v1.0.0"; exit 1; }
          echo "Mirroring $SOURCE_REPO $TAG to $TARGET_REPO"

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$SOURCE_REPO" --json name,isPrerelease,body > release.json
          mkdir dist
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir dist
          ls -l dist

      - name: Check the downloads
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt

      # The notes end with GitHub's generated change list, whose links point into this private
      # repository and would be dead in the public one: keep only the part above it.
      - name: Write the public release notes
        run: |
          jq -r .body release.json \
            | awk '/^## What.s Changed/ || /^## New Contributors/ || /^\*\*Full Changelog\*\*/ { exit } { print }' \
            > notes.md
          if grep -q "github.com/$SOURCE_REPO" notes.md; then
            echo "::error::The notes still link to $SOURCE_REPO; not publishing them"
            exit 1
          fi
          cat notes.md

      - name: Publish to the public repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          name=$(jq -r .name release.json)
          prerelease=$(jq -r .isPrerelease release.json)
          if gh release view "$TAG" --repo "$TARGET_REPO" > /dev/null 2>&1; then
            # Mirrored before (a re-run, or a re-published release): bring it up to date.
            gh release edit "$TAG" --repo "$TARGET_REPO" --title "$name" --notes-file notes.md --prerelease="$prerelease"
            gh release upload "$TAG" dist/* --repo "$TARGET_REPO" --clobber
          else
            flags=(--repo "$TARGET_REPO" --target main --title "$name" --notes-file notes.md)
            [[ "$prerelease" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
          echo "Published: https://github.com/$TARGET_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
