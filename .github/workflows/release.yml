name: Release

# Pushing a version tag (v1.0.0, or v1.1.0-beta.1) builds the app for every platform
# below and attaches them all to one GitHub Release for that tag:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The Windows and Linux builds publish the release as soon as they finish. The macOS builds run alongside
# and are added to the release when they finish: GitHub's macOS runners can be slow to start, or never
# start (the job is then cancelled), so they never hold the release back. If one is missing, the run ends
# in a failure: use "Re-run failed jobs" on it to build the missing macOS download and add it.
#
# It can also be run by hand (Actions > Release > Run workflow) with an existing tag, for example to
# release a tag again with this version of the workflow.
#
# The version shown in the app comes from the tag, not from Directory.Build.props.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (e.g. v1.0.2)
        required: true

permissions:
  contents: read

# One release run per tag at a time; a second run for the same tag waits rather than racing it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Windows and Linux: published together, so one failure stops the release.
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }   # Raspberry Pi (64-bit OS) and other ARM boards
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      rid: ${{ matrix.rid }}
      os: ${{ matrix.os }}
      group: main

  # macOS: added to the release on their own; one stuck build doesn't stop the other.
  build-macos:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-x64,   os: macos-latest }   # Intel Macs
          - { rid: osx-arm64, os: macos-latest }   # Apple silicon
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      rid: ${{ matrix.rid }}
      os: ${{ matrix.os }}
      group: macos

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-main-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          Pick the file for your computer (`GS.Point3DWeb-<version>-<platform>`). Each one includes everything it needs, so .NET doesn't have to be installed.

          | Platform | For |
          | --- | --- |
          | `win-x64.zip` | Windows (Intel / AMD) |
          | `win-arm64.zip` | Windows on ARM |
          | `linux-x64.tar.gz` | Linux (Intel / AMD) |
          | `linux-arm64.tar.gz` | Linux on 64-bit ARM, such as a Raspberry Pi with a 64-bit OS |
          | `osx-x64.tar.gz` | macOS on Intel |
          | `osx-arm64.tar.gz` | macOS on Apple silicon |

          Extract it and run `GS.Point3DWeb` (`GS.Point3DWeb.exe` on Windows): it opens <http://localhost:5000> in your browser once it has started (start it with `--OpenBrowser=false`, or set `"OpenBrowser": false` in `appsettings.json`, to stop that). ASCOM COM drivers work only on Windows; Alpaca servers work everywhere. See the README for running it on another port or for other computers on the network.

          The downloads aren't code-signed. On Windows, if "Windows protected your PC" appears, click **More info** then **Run anyway**, or unblock the `.zip` before extracting it (right-click it, **Properties**, tick **Unblock**). On macOS, if the app is blocked, run `xattr -dr com.apple.quarantine` on the extracted folder. The macOS downloads can appear a little after the others, as GitHub's macOS build machines are sometimes slow to start. `SHA256SUMS.txt` lists each file's checksum.

          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run updates the existing release instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Every release is published as a pre-release for now. To publish normal releases again,
            # remove --prerelease here (or keep it only for tags with a suffix: [[ "$TAG" == *-* ]]).
            flags=(--verify-tag --title "GS Point3D Web ${TAG#v}" --notes-file notes.md --generate-notes --prerelease)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi

  macos:
    name: Add the macOS downloads
    needs: [build-macos, release]
    # Whatever happened to the macOS builds, as long as the release was published.
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload files to the release

    steps:
      - name: Download the macOS packages
        uses: actions/download-artifact@v8
        # Nothing to download when both macOS builds were cancelled.
        continue-on-error: true
        with:
          pattern: package-macos-*
          merge-multiple: true
          path: dist

      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          missing=()
          for rid in osx-x64 osx-arm64; do
            file="dist/GS.Point3DWeb-$version-$rid.tar.gz"
            if [[ -f "$file" ]]; then
              gh release upload "$TAG" "$file" --clobber
              echo "Added $(basename "$file")"
            else
              missing+=("$rid")
            fi
          done

          # Checksums for everything now on the release.
          mkdir all
          gh release download "$TAG" --dir all --pattern 'GS.Point3DWeb-*'
          (cd all && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" all/SHA256SUMS.txt --clobber

          if (( ${#missing[@]} )); then
            echo "::error::The release is published without ${missing[*]}: its build didn't finish. Use 'Re-run failed jobs' on this run to build it and add it."
            exit 1
          fi
